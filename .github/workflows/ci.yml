name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: v0.1.1 release-candidate smoke
        run: node scripts/v011-release-candidate-smoke.mjs

      - name: engawa-map release-candidate pack smoke
        run: node scripts/map-release-candidate-smoke.mjs

      - name: engawa-cli release-candidate pack smoke
        run: node scripts/cli-release-candidate-smoke.mjs

      - name: External npm consumer smoke
        run: node scripts/external-consumer-smoke.mjs 0.1.1
